<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Veterinaria Mascotas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--tx:#3b2a1f;--mut:#7b6657;--pri:#e76825;--pt:#fff;--dk:#7a3410;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--wb:#fef3c7;--bad:#b91c1c;--bb:#fee2e2;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#ffffff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 14px 60px}
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:25px;margin:0}h2{margin:0 0 10px}
.btn,button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;min-height:48px;background:var(--pri);color:var(--pt);font-weight:600}
.btn.sec,button.sec{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.sm{min-height:40px;padding:6px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.stat small{display:block;color:var(--mut);font-size:15px}.stat b{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{min-height:110px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tile span{font-size:38px}
.tile.sell{background:#15803d;color:#fff}.tile.buy{background:#1d4ed8;color:#fff}
label{display:block;font-size:15px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:2px solid var(--bd);background:#ffffff;color:var(--tx);min-height:48px}
.res{margin-top:8px;display:grid;gap:6px}.item{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#ffffff;color:var(--tx);border:2px solid var(--bd);width:100%;padding:10px;border-radius:10px;cursor:pointer}
small{display:block;color:var(--mut);font-size:14px;font-weight:400}.mut{color:var(--mut)}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.line{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty{display:flex;gap:4px;align-items:center}.qty input{width:70px;text-align:center}.qty button,.x{padding:0;width:44px;min-height:44px}.x{background:var(--bb);color:var(--bad)}
.pr{margin:0}.pr input{width:110px}.sub{min-width:90px;text-align:right}
.tot{display:flex;justify-content:space-between;font-size:26px;font-weight:700;padding:12px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row .g{flex:1;min-width:160px}
.badge{padding:3px 10px;border-radius:99px;font-size:15px;font-weight:700;background:var(--okb);color:var(--ok)}.badge.warn{background:var(--wb);color:var(--warn)}.badge.bad{background:var(--bb);color:var(--bad)}
.alert{background:var(--wb);color:var(--warn);padding:8px 12px;border-radius:10px;margin:6px 0;font-weight:600}.alert.r{background:var(--bb);color:var(--bad)}
.bar{height:16px;border-radius:8px;background:var(--pri);min-width:2px}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1}
#mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:20;padding:16px;overflow:auto}#mod.on{display:block}
.box{background:#ffffff;max-width:520px;margin:5vh auto;border-radius:16px;padding:18px;border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;display:none;z-index:30;max-width:92%}
#toast.show{display:block}#toast.bad{background:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
@media(max-width:600px){.line{grid-template-columns:1fr auto}.line .qty,.line .pr{grid-column:1/3}}
#hdr{background:#e76825;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(122,52,16,0.2);max-width:980px;margin:0 auto}
#hdr img{height:56px;width:auto;border-radius:10px;display:block}#hdr .hn{flex:1;font-size:22px;line-height:1.15;font-weight:800}#hdr .hn small{color:#fff;opacity:.92;font-weight:500}
#clock{text-align:right}#ck{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}#cd{font-size:14px;text-transform:capitalize}
.btn,button{border-radius:14px}.stat b{color:var(--tx)}
.btn.tile{background:#ffffff;color:var(--tx);border:2px solid var(--bd);border-radius:22px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}.btn.tile:active{transform:scale(.97)}
.btn.tile.sell{background:var(--pri);color:var(--pt);border-color:var(--pri)}.btn.tile.buy{background:var(--dk);color:#fff;border-color:var(--dk)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pri);border-color:var(--pri)}
@media(max-width:520px){#ck{font-size:22px}#cd{font-size:12px}#hdr .hn{font-size:18px}#hdr .hn small{display:none}#hdr img{height:44px}}
</style></head><body>

<div id="wrap"><div id="top"></div><div id="app"></div></div><div id="mod"></div><div id="toast"></div>
<script>
const K='vet_v1';let D=load(),V='home',cart=[],paid=null,sel={};
function load(){
  try{
    const s=localStorage.getItem(K);
    if(s){
      const d=JSON.parse(s);
      d.products ||= []; d.providers ||= []; d.sales ||= []; d.purchases ||= [];
      d.cash ||= []; d.log ||= []; d.seq ||= 1;
      d.seqSale = Math.max(Number(d.seqSale)||1, d.sales.reduce((max,x)=>Math.max(max,Number(x.n)||0),0)+1);
      d.seqBuy = Math.max(Number(d.seqBuy)||1, d.purchases.reduce((max,x)=>Math.max(max,Number(x.n)||0),0)+1);
      d.sales.forEach(x=>{x.pays ||= []; x.items ||= [];});
      d.purchases.forEach(x=>{x.pays ||= []; x.items ||= [];});
      return d;
    }
  }catch(e){}
  return{products:[],providers:[],sales:[],purchases:[],cash:[],log:[],seq:1,seqSale:1,seqBuy:1}
}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('No se pudo guardar en este navegador',1)}}
const F=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2});const $=n=>F.format(n||0);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=s=>document.querySelector(s),num=v=>parseFloat(String(v).replace(',','.'))||0,r2=n=>Math.round(n*100)/100;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=s=>s.split('-').reverse().join('/'),mk=d=>d.slice(0,7),P=id=>D.products.find(p=>p.id==id);
function toast(m,bad){const t=q('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3800)}
function modal(h){q('#mod').innerHTML='<div class="box">'+h+'</div>';q('#mod').className='on'}
function cm(){q('#mod').className='';q('#mod').innerHTML=''}
function ask(msg,fn){window._f=fn;modal(`<h2>${msg}</h2><div class="acts"><button class="btn sec" onclick="cm()">No, volver</button><button class="btn" onclick="_f()">Sí, confirmar</button></div>`)}
function logit(t,txt,amt,ref){D.log.unshift({id:D.seq++,d:today(),h:new Date().toTimeString().slice(0,5),t,txt,amt,ref})}
const paidOf=o=>o.pays.reduce((a,p)=>a+p.a,0),sold=()=>D.sales.filter(s=>!s.void),bought=()=>D.purchases.filter(s=>!s.void);
const profit=s=>s.items.reduce((a,i)=>a+(i.p-i.c)*i.q,0);

function ledger(){
  const L=[];
  D.sales.filter(s=>!s.void).forEach(s=>s.pays.forEach(p=>L.push({d:p.d,t:'in',c:'Venta #'+s.n+(s.cl?' – '+s.cl:''),a:p.a,m:p.m})));
  D.purchases.filter(c=>!c.void).forEach(c=>c.pays.forEach(p=>L.push({d:p.d,t:'out',c:'Compra #'+c.n+' – '+c.pv,a:p.a,m:p.m})));
  D.cash.forEach(x=>L.push(x));
  return L.sort((a,b)=>b.d.localeCompare(a.d));
}

const TITLES={home:'',sell:'💰 Vender',buy:'🛒 Registrar compra',prods:'📦 Productos y stock',money:'💵 Dinero',pend:'📋 Cuentas pendientes',hist:'🕘 Historial',rep:'📊 Informes del mes'};
function go(v){V=v;if(v=='sell'||v=='buy'){cart=[];paid=null;sel={}}render();scrollTo(0,0)}
function render(){q('#top').innerHTML=V=='home'?`<h1>${gr()}, ¿qué querés hacer?</h1>`:`<button class="btn sec" onclick="go('home')">← Volver al inicio</button><h1>${TITLES[V]}</h1>`;q('#app').innerHTML=views[V]();if(after[V])after[V]()}
const views={
home(){const m=mk(today()),ss=sold().filter(s=>mk(s.d)==m),td=sold().filter(s=>s.d==today());
const bal=ledger().reduce((a,x)=>a+(x.t=='in'?x.a:-x.a),0),low=D.products.filter(p=>!p.svc&&p.stock<=p.min);

money(){const L=ledger(),m=mk(today()),bal=L.reduce((a,x)=>a+(x.t=='in'?x.a:-x.a),0),mi=L.filter(x=>mk(x.d)==m).reduce((a,x)=>a+(x.t=='in'?x.a:-x.a),0),mo=L.filter(x=>mk(x.d)==m&&x.t=='out').reduce((a,x)=>a+x.a,0);

const top=Object.entries(M).sort((a,b)=>b[1].t-a[1].t).slice(0,6),mons=[];for(let i=5;i>=0;i--){const d=new Date(new Date().getFullYear(),new Date().getMonth()-i,1);mons.push([d.toISOString().slice(0,7).replace(/^(\d+)-(\d+)$/,(x,y,mo)=>y+'-'+mo),d.toLocaleDateString('es-AR',{month:'short'})])}

function sr(){const t=(q('#sq').value||'').toLowerCase(),r=D.products.filter(p=>!t||(p.name+' '+p.code).toLowerCase().includes(t)).slice(0,8);
q('#res').innerHTML=r.length?r.map(p=>`<button class="item" onclick="add(${p.id})"><span>${esc(p.name)}<small>${p.svc?'Servicio':'Stock: '+p.stock}</small></span><b>${$(V=='sell'?p.price:p.cost)}</b></button>`).join(''):'<p class="mut">No encontré nada. <button class="btn sm" onclick="pf()">Crear producto nuevo</button></p>'}

function scanKey(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    const t=(q('#sq').value||'').trim().toLowerCase();
    if(!t) return;
    const match = D.products.find(p => p.code && p.code.toLowerCase() === t);
    if(match){
      add(match.id);
      q('#sq').value = '';
      sr();
    }

<label class="pr">${s?'Precio':'Costo'} c/u<input id="price-${i}" value="${l.p}" inputmode="decimal" oninput="ps(${i},this.value)"></label><b class="sub">${$(l.q*l.p)}</b><button class="x" onclick="rm(${i})">✕</button></div>`}).join(''):'<p class="mut">Todavía no agregaste nada. Buscá arriba y tocá un producto.</p>')+
`<div class="tot">Total <span>${$(t)}</span></div>`+(s?`<label>Cliente (opcional, obligatorio si queda deuda)</label><input value="${esc(sel.cl||'')}" oninput="sel.cl=this.value">`:`<label>Proveedor</label><input list="pvl" value="${esc(sel.pv||'')}" oninput="sel.pv=this.value" placeholder="Elegí uno o escribí uno nuevo"><datalist id="pvl">${D.providers.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`)+
`<label>Forma de pago</label><select onchange="sel.m=this.value">${['Efectivo','Transferencia','Tarjeta','Mercado Pago'].map(x=>`<option ${sel.m==x?'selected':''}>${x}</option>`).join('')}</select>

(pd<t?`<p class="warn"><b>Queda pendiente: ${$(t-pd)}</b></p>`:'')+(s?'':`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:26px;min-height:26px" ${sel.upd!==false?'checked':''} onchange="sel.upd=this.checked"> Actualizar precios de venta con mi ganancia habitual</label>`)+
`<div class="acts"><button class="btn sec" onclick="go('home')">Cancelar</button><button class="btn" onclick="${s?'saveSale()':'saveBuy()'}">✔ Guardar ${s?'venta':'compra'}</button></div>`}

function saveSale(){if(!cart.length)return toast('Agregá al menos un producto',1);
for(const l of cart){const p=P(l.pid);if(!p.svc&&l.q>p.stock)return toast(`No alcanza el stock de ${p.name}: quedan ${p.stock}`,1)}
const t=r2(tot()),pd=paid==null?t:paid;if(pd>t)return toast('Lo pagado no puede ser mayor al total',1);if(pd<t&&!(sel.cl||'').trim())return toast('Para dejar deuda, escribí el nombre del cliente',1);
const n=D.seqSale++,s={id:D.seq++,n,d:today(),cl:(sel.cl||'').trim(),total:t,items:cart.map(l=>{const p=P(l.pid);return{pid:l.pid,nm:p.name,q:l.q,p:l.p,c:p.cost}}),pays:pd>0?[{d:today(),a:pd,m:sel.m||'Efectivo'}]:[]};
cart.forEach(l=>{const p=P(l.pid);if(!p.svc)p.stock=r2(p.stock-l.q)});D.sales.push(s);logit('venta',`Venta #${n}${s.cl?' a '+s.cl:''}: ${s.items.map(i=>i.q+' '+i.nm).join(', ')}`,t,'s:'+s.id);save();go('sell');toast('✔ Venta guardada: '+$(t))}

function saveBuy(){if(!cart.length)return toast('Agregá al menos un producto',1);const pv=(sel.pv||'').trim();if(!pv)return toast('Elegí o escribí el proveedor',1);
const t=r2(tot()),pd=paid==null?t:paid;if(pd>t)return toast('Lo pagado no puede ser mayor al total',1);if(!D.providers.includes(pv))D.providers.push(pv);
const n=D.seqBuy++,c={id:D.seq++,n,d:today(),pv,total:t,items:cart.map(l=>({pid:l.pid,nm:P(l.pid).name,q:l.q,c:l.p})),pays:pd>0?[{d:today(),a:pd,m:sel.m||'Efectivo'}]:[]};
cart.forEach(l=>{const p=P(l.pid);if(!p.svc)p.stock=r2(p.stock+l.q);p.cost=l.p;if(sel.upd!==false)p.price=Math.round(l.p*(1+p.mg/100))});
D.purchases.push(c);logit('compra',`Compra #${n} a ${pv}: ${c.items.map(i=>i.q+' '+i.nm).join(', ')}`,t,'p:'+c.id);save();go('buy');toast('✔ Compra guardada: '+$(t))}

function editSale(id){
  const s = D.sales.find(x => x.id == id);
  if(!s || s.void) return;
  cart = s.items.map(i => ({pid: i.pid, q: i.q, p: i.p}));
  paid = paidOf(s);
  sel = {cl: s.cl || '', m: s.pays[0]?.m || 'Efectivo', editingId: s.id};
  modal(`<h2>Editar Venta #${s.n}</h2>
  <div id="editCart"></div>
  <div class="acts"><button class="btn sec" onclick="cm()">Cancelar</button><button class="btn" onclick="saveEditedSale(${s.id})">✔ Guardar cambios</button></div>`);
  renderEditCart();
}

function renderEditCart(){
  const t = tot();
  q('#editCart').innerHTML = cart.map((l, i) => {
    const p = P(l.pid);
    return `<div class="line"><div><b>${esc(p ? p.name : l.nm)}</b></div>
    <div class="qty"><button class="sec" onclick="qaEdit(${i},-1)">−</button><input id="edit-qty-${i}" value="${l.q}" inputmode="decimal" oninput="qsEdit(${i},this.value)"><button class="sec" onclick="qaEdit(${i},1)">+</button></div>

  }).join('') +
  `<div class="tot">Total <span>${$(t)}</span></div>

  <label>Monto Cobrado</label><input id="edit-paid" value="${paid}" inputmode="decimal" oninput="paid=num(this.value)">`;
}

function qaEdit(i,d){cart[i].q=r2(cart[i].q+d);if(cart[i].q<=0)cart.splice(i,1);renderEditCart()}

function psEdit(i,v){cart[i].p=num(v);editRefreshKeepingFocus(()=>{})}

function saveEditedSale(id){
  const s = D.sales.find(x => x.id == id);
  if(!s || s.void) return;
  if(!cart.length) return toast('La venta debe tener al menos un producto',1);
  const t=r2(tot()), pd=r2(Math.max(0,Number(paid)||0));
  if(pd>t) return toast('Lo cobrado no puede ser mayor al total',1);
  if(pd<t && !(sel.cl||'').trim()) return toast('Para dejar deuda, escribí el nombre del cliente',1);

  const restored={};
  s.items.forEach(i=>{const p=P(i.pid);if(p&&!p.svc)restored[p.id]=(restored[p.id]||0)+Number(i.q||0)});
  for(const l of cart){
    const p=P(l.pid);
    if(p&&!p.svc&&l.q>Number(p.stock||0)+(restored[p.id]||0))
      return toast(`No alcanza el stock de ${p.name}: disponibles ${Number(p.stock||0)+(restored[p.id]||0)}`,1);
  }

  s.items.forEach(i=>{const p=P(i.pid);if(p&&!p.svc)p.stock=r2(p.stock+i.q)});
  cart.forEach(l=>{const p=P(l.pid);if(p&&!p.svc)p.stock=r2(p.stock-l.q)});
  const oldPaid=paidOf(s);
  s.total=t;s.cl=(sel.cl||'').trim();
  s.items=cart.map(l=>{const p=P(l.pid);return {pid:l.pid,nm:p?p.name:'Producto eliminado',q:r2(l.q),p:r2(l.p),c:p?Number(p.cost)||0:0}});
  if(Math.abs(pd-oldPaid)>0.005) s.pays=pd>0?[{d:today(),a:pd,m:sel.m||'Efectivo'}]:[];
  logit('venta',`Venta #${s.n} modificada. Nuevo total: ${$(t)}`,t,'s:'+s.id);
  save();cm();render();toast('✔ Venta modificada');
}

q('#pl').innerHTML=r.map(p=>{const lo=!p.svc&&p.stock<=p.min;return `<div class="row"><div class="g"><b>${esc(p.name)}</b><small>${esc(p.cat)}${p.code?' · '+esc(p.code):''} · ganás ${$(p.price-p.cost)} (${p.cost?Math.round((p.price-p.cost)/p.cost*100):0}%)</small></div><span class="badge ${p.svc?'':p.stock<=0?'bad':lo?'warn':''}">${p.svc?'Servicio':p.stock<=0?'Sin stock':p.stock}</span><b>${$(p.price)}</b><button class="btn sec sm" onclick="pf(${p.id})">Editar</button>${p.svc?'':`<button class="btn sec sm" onclick="sa(${p.id})">Stock</button>`}</div>`}).join('')||'<p class="mut">No hay productos para mostrar.</p>'}

modal(`<h2>${id?'Editar':'Nuevo'} producto</h2><label>Nombre</label><input id="f1" value="${esc(p.name)}"><label>Código (opcional)</label><input id="f2" value="${esc(p.code)}">

<label>¿Es un producto o un servicio?</label><select id="f4"><option value="0">Producto (tiene stock)</option><option value="1" ${p.svc?'selected':''}>Servicio (consulta, baño, vacuna…)</option></select>

function pfs(id){const n=q('#f1').value.trim(),c=q('#f2').value.trim(),pr=num(q('#f7').value);if(!n)return toast('Escribí el nombre',1);if(pr<=0)return toast('El precio de venta debe ser mayor a 0',1);

function sa(id){const p=P(id);modal(`<h2>Ajustar stock: ${esc(p.name)}</h2><p class="mut">Ahora figuran ${p.stock}. Contá lo que hay realmente y escribilo acá.</p><label>Cantidad real</label><input id="s1" value="${p.stock}" inputmode="decimal"><label>Motivo</label><select id="s2"><option>Conteo del inventario</option><option>Rotura o vencimiento</option><option>Regalo o muestra</option><option>Otro</option></select><div class="acts"><button class="btn sec" onclick="cm()">Cancelar</button><button class="btn" onclick="sas(${id})">Guardar</button></div>`)}
function sas(id){const p=P(id),v=num(q('#s1').value);if(v<0)return toast('No puede ser negativo',1);logit('stock',`${p.name}: de ${p.stock} a ${v} (${q('#s2').value})`);p.stock=v;save();cm();render();toast('✔ Stock actualizado')}
function mm(t){modal(`<h2>${t=='in'?'Entró dinero':'Salió dinero'}</h2><label>¿De qué fue?</label><input id="m1" placeholder="${t=='in'?'Ej: Aporte propio':'Ej: Luz, alquiler, sueldo'}"><label>Monto</label><input id="m2" inputmode="decimal"><label>Fecha</label><input id="m3" type="date" value="${today()}"><div class="acts"><button class="btn sec" onclick="cm()">Cancelar</button><button class="btn" onclick="mms('${t}')">Guardar</button></div>`)}
function mms(t){const c=q('#m1').value.trim(),a=num(q('#m2').value);if(!c)return toast('Escribí de qué fue',1);if(a<=0)return toast('El monto debe ser mayor a 0',1);
D.cash.push({id:D.seq++,d:q('#m3').value||today(),t,c,a});logit('dinero',(t=='in'?'Entrada: ':'Gasto: ')+c,a);save();cm();render();toast('✔ Guardado')}
function pay(k,id){const o=(k=='s'?D.sales:D.purchases).find(x=>x.id==id),d=r2(o.total-paidOf(o));modal(`<h2>${k=='s'?'Cobrar':'Pagar'} #${o.n}</h2><p>Falta ${k=='s'?'cobrar':'pagar'}: <b>${$(d)}</b></p><label>Monto</label><input id="y1" value="${d}" inputmode="decimal"><label>Forma de pago</label><select id="y2"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mercado Pago</option></select><div class="acts"><button class="btn sec" onclick="cm()">Cancelar</button><button class="btn" onclick="pays('${k}',${id})">Guardar</button></div>`)}
function pays(k,id){const o=(k=='s'?D.sales:D.purchases).find(x=>x.id==id),d=r2(o.total-paidOf(o)),a=num(q('#y1').value);if(a<=0||a>d+0.005)return toast('El monto debe ser mayor a 0 y no superar '+$(d),1);
o.pays.push({d:today(),a,m:q('#y2').value});logit(k=='s'?'cobro':'pago',(k=='s'?'Cobro de ':'Pago de ')+'#'+o.n+' – '+(k=='s'?o.cl:o.pv),a);save();cm();render();toast('✔ Registrado')}

function hl(){const f=q('#hf').value,t=(q('#hq').value||'').toLowerCase();
q('#hl').innerHTML=D.log.filter(x=>(!f||x.t==f)&&(!t||x.txt.toLowerCase().includes(t))).slice(0,150).map(x=>{let b='';if(x.ref){const[k,id]=x.ref.split(':'),o=(k=='s'?D.sales:D.purchases).find(y=>y.id==id);b=o&&o.void?'<span class="badge bad">Anulada</span>':o?`<button class="btn sec sm" onclick="an('${k}',${id})">Anular</button>${k=='s' ? ` <button class="btn sec sm" onclick="editSale(${id})">Editar</button>` : ''}`:''}
return `<div class="row"><div class="g"><b>${esc(x.txt)}</b><small>${fd(x.d)} ${x.h||''} · ${x.t}</small></div>${x.amt!=null?`<b>${$(x.amt)}</b>`:''}${b}</div>`}).join('')||'<p class="mut">No hay movimientos.</p>'}

function an(k,id){ask('¿Anular esta operación? Se devuelve el stock y el dinero.',()=>{const o=(k=='s'?D.sales:D.purchases).find(x=>x.id==id);if(!o||o.void)return;o.void=1;
o.items.forEach(i=>{const p=P(i.pid);if(p&&!p.svc)p.stock=r2(p.stock+(k=='s'?i.q:-i.q))});const a=paidOf(o);
if(a>0)D.cash.push({id:D.seq++,d:today(),t:k=='s'?'out':'in',c:(k=='s'?'Anulación venta #':'Anulación compra #')+o.n,a});
logit('anulación',(k=='s'?'Venta #':'Compra #')+o.n+' anulada',o.total);save();cm();render();toast('Operación anulada')})}
function bk(){modal(`<h2>💾 Copia de seguridad</h2><p class="mut">Los datos se guardan en este navegador. Copiá este texto y guardalo en un lugar seguro (WhatsApp a vos misma, mail). Para recuperar, pegalo acá y tocá Restaurar.</p><textarea id="b1" rows="7">${esc(JSON.stringify(D))}</textarea><div class="acts"><button class="btn sec" onclick="cm()">Cerrar</button><button class="btn" onclick="bc()">Copiar</button><button class="btn sec" onclick="br()">Restaurar</button></div>`)}
function bc(){const t=q('#b1');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('✔ Copiado')}
function br(){let d;try{d=JSON.parse(q('#b1').value);if(!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0}catch(e){return toast('El texto no es una copia válida',1)}
ask('Esto reemplaza todos los datos actuales. ¿Seguro?',()=>{D=d;save();cm();go('home');toast('✔ Datos restaurados')})}
function demo(){[['Alimento perro adulto 15kg','7790001','Alimento',42000,35,3,20],['Alimento gato 7,5kg','7790002','Alimento',28000,40,5,8],['Pipeta antipulgas','7790003','Medicamentos',6500,60,3,12],['Collar mediano','7790004','Accesorios',3200,80,2,10],['Shampoo medicado','7790005','Higiene',4800,50,3,2]].forEach(([n,c,k,co,mg,mi,st])=>D.products.push({id:D.seq++,name:n,code:c,cat:k,svc:false,cost:co,mg,price:Math.round(co*(1+mg/100)),stock:st,min:mi}));
D.products.push({id:D.seq++,name:'Consulta',code:'',cat:'Servicios',svc:true,cost:0,mg:0,price:15000,stock:0,min:0});save();render();toast('✔ Productos de ejemplo cargados')}
const gr=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches'};
function tick(){const d=new Date();q('#ck').textContent=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});q('#cd').textContent=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,1000);
render();
</script></body></html>
